name: Build Curs OS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm xorriso

      - name: Build bootloader + ISO
        run: |
          cd bootloader
          bash build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: curs-os-iso
          path: curs-os.iso
          retention-days: 14

      - name: Upload raw disk image
        uses: actions/upload-artifact@v4
        with:
          name: curs-img
          path: bootloader/curs.img
          retention-days: 14
